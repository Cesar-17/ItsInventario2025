<body>

<div class="app-layout">

    <!-- Topbar -->

    <!-- Contenido -->
    <main class="content">

      <div class="page-header">

          <i class="bi bi-cart3 me-2" style="color:var(--c-primary)"></i>
          Historial de Compras
        </h2>

              placeholder="Buscar por no. orden o proveedor…">

</div>

<!-- Modal: detalle de orden -->
<div class="modal fade" id="modalOrden" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-file-earmark-text me-2"></i>Detalle de orden</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" id="modalOrdenBody"></div>
      <div class="modal-footer" id="modalOrdenFooter"></div>
    </div>
  </div>
</div>

<script src="../js/bootstrap.bundle.min.js"></script>
<script>
  /* ── Sidebar toggle ── */
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const wrapper = document.getElementById('mainWrapper');
    if (window.innerWidth <= 1100) {
      const open = sidebar.classList.toggle('open');
      overlay.classList.toggle('visible', open);
    } else {
      sidebar.classList.toggle('collapsed');
      wrapper.classList.toggle('sidebar-hidden');
    }
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('visible');
  }

  /* ── Error div ── */
  function getOrCreateErrorDiv() {
    let d = document.getElementById('fetchError');
    if (!d) {
      d = document.createElement('div'); d.id = 'fetchError';
      d.style.cssText = 'margin:10px 0;color:#856404;background:#fff3cd;padding:8px 12px;border-radius:6px;display:none;font-size:13px;';
      const container = document.querySelector('.card-panel');
      if (container) container.insertBefore(d, container.firstChild);
    }
    return d;
  }

  /* ── Fetch ordenes ── */
  async function fetchOrdenes() {
    const errDiv = getOrCreateErrorDiv();
    try {
      const res  = await fetch('<?= BASE_PATH ?>includes/get_ordenes.php');
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch(ex) {
        errDiv.textContent = 'Respuesta no JSON: ' + text.substring(0, 1000);
        console.error('Respuesta no JSON get_ordenes:', text); return;
      }
      if (!res.ok) { errDiv.textContent = 'Error HTTP ' + res.status; return; }
      if (!data.ok) { errDiv.textContent = 'Error: ' + (data.error || 'respuesta ok=false'); return; }
      errDiv.textContent = '';
      window._ordenes = data.ordenes || [];
      renderOrdenes(window._ordenes);
    } catch(err) {
      errDiv.textContent = 'Error al obtener órdenes: ' + err.message;
    }
  }

  /* ── Render tabla ── */
  function renderOrdenes(rows) {
    const tbody  = document.getElementById('productosTableBody');
    const errDiv = getOrCreateErrorDiv();
    tbody.innerHTML = '';
    if (!rows || rows.length === 0) {
      errDiv.textContent = 'No hay órdenes para mostrar.'; errDiv.style.display = 'block'; return;
    }
    errDiv.textContent = ''; errDiv.style.display = 'none';

    for (const o of rows) {
      const tr      = document.createElement('tr');
      const numero  = o.numero || o.folio || '';
      const estado  = o.estado || o.estatus || '';
      const canMark = !(estado && estado.toLowerCase().includes('recib'));
      const isRecv  = !canMark;

      tr.innerHTML = `
        <td><span style="font-weight:700;color:var(--c-primary)">${o.id}</span></td>
        <td><span style="font-family:var(--font-brand);font-weight:700">${numero}</span></td>
        <td><small style="color:var(--c-text-md)">${o.fecha}</small></td>
        <td>${o.proveedor || ''}</td>
        <td>${isRecv
          ? '<span class="badge-received"><i class="bi bi-check-circle-fill"></i> Recibida</span>'
          : '<span class="badge-pending"><i class="bi bi-clock-fill"></i> Pendiente</span>'}</td>
        <td style="font-weight:700;color:var(--c-primary)">${o.total ? '$' + o.total : ''}</td>
        <td>
          <div style="display:flex;gap:5px;justify-content:center;flex-wrap:wrap">
            <button class="btn-tbl-view" onclick="viewOrden(${o.id})"><i class="bi bi-eye"></i> Ver</button>
            ${canMark ? `<button class="btn-tbl-success" onclick="markReceived(${o.id}, this)"><i class="bi bi-check-lg"></i> Recibida</button>` : ''}
          </div>
        </td>`;
      tbody.appendChild(tr);
    }
  }

  /* ── Ver detalle ── */
  function viewOrden(id) {
    const o = (window._ordenes || []).find(x => x.id == id);
    if (!o) return alert('Orden no encontrada');
    const body    = document.getElementById('modalOrdenBody');
    const numero2 = o.numero || o.folio || '';
    const estado2 = o.estado || o.estatus || '';
    const isRecv  = estado2 && String(estado2).toLowerCase().includes('recib');

    let html = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
        <div style="background:#f8faff;padding:12px 14px;border-radius:8px;border-left:3px solid var(--c-primary)">
          <div style="font-size:11px;font-weight:700;color:var(--c-text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">No. Orden</div>
          <div style="font-weight:800;font-size:16px;color:var(--c-primary)">${numero2 || '—'}</div>
        </div>
        <div style="background:#f8faff;padding:12px 14px;border-radius:8px;border-left:3px solid var(--c-gold)">
          <div style="font-size:11px;font-weight:700;color:var(--c-text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Fecha</div>
          <div style="font-weight:600;font-size:15px">${o.fecha || '—'}</div>
        </div>
      </div>
      <table style="width:100%;font-size:13px;margin-bottom:12px">
        <tr><td style="padding:5px 0;color:var(--c-text-muted);width:130px">Proveedor</td><td style="font-weight:600">${o.proveedor || '—'}</td></tr>
        <tr><td style="padding:5px 0;color:var(--c-text-muted)">Estado</td>
            <td>${isRecv ? '<span class="badge-received"><i class="bi bi-check-circle-fill"></i> Recibida</span>' : '<span class="badge-pending"><i class="bi bi-clock-fill"></i> Pendiente</span>'}</td></tr>
        <tr><td style="padding:5px 0;color:var(--c-text-muted)">Observaciones</td><td>${o.descripcion_general || o.observaciones || '—'}</td></tr>
        <tr><td style="padding:5px 0;color:var(--c-text-muted)">Total</td><td style="font-weight:700;color:var(--c-primary);font-size:15px">${o.total ? '$' + o.total : '—'}</td></tr>
      </table>`;

    if (o.detalles && o.detalles.length) {
      html += `<hr style="border-color:var(--c-border)"><h6 style="font-weight:700;margin-bottom:8px"><i class="bi bi-list-ul me-1"></i>Detalles</h6>
        <div style="overflow-x:auto"><table class="table table-sm table-striped">
          <thead><tr><th>#</th><th>Producto</th><th>Descripción</th><th>Cant.</th><th>Unidad</th><th>Precio</th><th>Importe</th></tr></thead><tbody>`;
      let idx = 1;
      for (const d of o.detalles) {
        const precio  = d.precio || d.precio_unitario || '';
        const importe = d.importe || '';
        html += `<tr><td>${idx++}</td><td>${d.producto_id ? (d.codigo_barras || d.producto_id) : ''}</td><td>${d.descripcion}</td><td>${d.cantidad}</td><td>${d.unidad || ''}</td><td>${precio}</td><td>${importe}</td></tr>`;
      }
      html += '</tbody></table></div>';
    }
    body.innerHTML = html;

    /* Footer con botones */
    const footer     = document.getElementById('modalOrdenFooter');
    const canMarkInline = !(estado2 && String(estado2).toLowerCase().includes('recib'));
    footer.innerHTML = `
      <button type="button" class="btn-outline-brand" data-bs-dismiss="modal"><i class="bi bi-x-lg me-1"></i> Cerrar</button>
      <button type="button" class="btn-primary-brand" id="btnDownloadPdfOrden"><i class="bi bi-file-earmark-pdf me-1"></i> Generar PDF</button>`;

    new bootstrap.Modal(document.getElementById('modalOrden')).show();

    /* PDF handler */
    document.getElementById('btnDownloadPdfOrden').onclick = async function() {
      const numeroSafe = (numero2 || 'orden').replace(/[^a-z0-9-_]/gi, '_');
      const filename   = `orden_${numeroSafe}_${o.fecha || ''}.pdf`;
      const pdfEl      = document.createElement('div');
      pdfEl.style.cssText = 'font-family:Arial,Helvetica,sans-serif;color:#222;position:relative;min-height:297mm;padding:20mm;box-sizing:border-box;';
      pdfEl.innerHTML = `<img src="../media/hoja_membretada_final.jpg" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:-1;" />
<div style="background:rgba(255,255,255,.9);padding:10mm;border-radius:5px;margin-top:60mm;">
  <div style="text-align:center;margin-bottom:12px">
    <h2 style="margin:0;color:#0B2D6B">AlmacenaTec</h2>
    <div style="font-size:12px;color:#666">Orden de Compra — TecNM Campus Saltillo</div>
    <div style="margin-top:10px;font-size:13px;color:#333"><strong>No. Orden:</strong> ${numero2} &nbsp;·&nbsp; <strong>Fecha:</strong> ${o.fecha || ''}</div>
    <hr style="border:none;border-top:1px solid #ddd;margin:10px 0">
  </div>
  <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:8px">
    <div><strong>Proveedor:</strong> ${o.proveedor || ''}</div>
    <div><strong>Jefe:</strong> ${o.jefe_nombre || o.jefe || ''}</div>
  </div>`;
      if (o.detalles && o.detalles.length) {
        let rows = ''; let idx = 1;
        for (const d of o.detalles) {
          const precio  = d.precio || d.precio_unitario || '';
          const importe = d.importe || '';
          rows += `<tr style="border-bottom:1px solid #eee"><td style="padding:6px">${idx++}</td><td style="padding:6px">${d.producto_id ? (d.codigo_barras || d.producto_id) : ''}</td><td style="padding:6px">${d.descripcion || ''}</td><td style="padding:6px;text-align:right">${d.cantidad || ''}</td><td style="padding:6px">${d.unidad || ''}</td><td style="padding:6px;text-align:right">${precio}</td><td style="padding:6px;text-align:right">${importe}</td></tr>`;
        }
        pdfEl.innerHTML += `<table style="width:100%;border-collapse:collapse;margin-top:10px;font-size:13px">
<thead><tr style="background:#0B2D6B;color:#fff">
  <th style="padding:8px">#</th><th style="padding:8px">Producto</th><th style="padding:8px">Descripción</th>
  <th style="padding:8px;text-align:right">Cantidad</th><th style="padding:8px">Unidad</th>
  <th style="padding:8px;text-align:right">Precio</th><th style="padding:8px;text-align:right">Importe</th>
</tr></thead><tbody>${rows}</tbody></table>`;
      }
      pdfEl.innerHTML += `<p style="margin-top:14px;font-size:14px"><strong>Total: $${o.total || ''}</strong></p></div>`;

      async function ensureHtml2Pdf() {
        if (typeof html2pdf !== 'undefined') return;
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://unpkg.com/html2pdf.js@0.9.3/dist/html2pdf.bundle.min.js';
          s.onload = () => resolve(); s.onerror = () => reject(new Error('no se pudo cargar html2pdf'));
          document.head.appendChild(s);
        });
      }
      try {
        await ensureHtml2Pdf();
        const opt = { margin: 10, filename, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: false, allowTaint: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
        await html2pdf().set(opt).from(pdfEl).save();
      } catch(err) {
        const w = window.open('', '_blank');
        const estilo = '<style>body{font-family:Arial,sans-serif;margin:20px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #444;padding:6px}</style>';
        let printable = '<!doctype html><html><head><meta charset="utf-8"><title>' + filename + '</title>' + estilo + '</head><body>' + pdfEl.innerHTML;
        printable += '<script>setTimeout(function(){ window.print(); }, 250);</' + 'script></body></html>';
        w.document.write(printable); w.document.close();
      }
    };
  }

  /* ── Marcar recibida ── */
  async function markReceived(id, btn) {
    if (!confirm('¿Marcar la orden como recibida?')) return;
    try {
      if (btn) btn.disabled = true;
      const res = await fetch('<?= BASE_PATH ?>handlers/toggle_orden_estado.php', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, estatus: 'recibida' })
      });
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || 'Error desconocido');
      const o = (window._ordenes || []).find(x => x.id == id);
      if (o) o.estatus = j.estatus || 'recibida';
      renderOrdenes(window._ordenes || []);
    } catch(err) {
      alert('Error: ' + err.message);
      if (btn) btn.disabled = false;
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    fetchOrdenes();
    const s = document.getElementById('searchItem');
    s.addEventListener('input', function() {
      const q = this.value.toLowerCase().trim();
      if (!q) return renderOrdenes(window._ordenes || []);
      renderOrdenes((window._ordenes || []).filter(x =>
        (x.numero || '').toLowerCase().includes(q) ||
        (x.proveedor || '').toLowerCase().includes(q)
      ));
    });
  });
</script>
</body>
